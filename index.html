<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#eceef2">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121316">
<title>Spin the Wheel</title>
<link rel="preload" href="fonts/schibsted-grotesk.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css?v=9">
<script src="script.js?v=9" defer></script>
</head>
<body>
<div class="app">
  <main class="stage">
    <div class="wheel-wrap" id="wrap">
      <svg class="pointer" id="pointer" viewBox="0 0 34 44" aria-hidden="true">
        <path d="M17 42 C12 30 3 24 3 14 A14 14 0 0 1 31 14 C31 24 22 30 17 42 Z" fill="var(--ink)"/>
        <circle cx="17" cy="14" r="5" fill="var(--surface)"/>
      </svg>
      <canvas id="wheel" aria-hidden="true"></canvas>
      <button class="hub" id="spinBtn" type="button" disabled>Spin</button>
    </div>

    <div class="result" id="result" role="status" aria-live="polite" hidden>
      <span class="dot" id="resDot"></span>
      <span class="name" id="resName"></span>
      <button type="button" id="resRemove">Remove</button>
      <button type="button" id="resClose">Done</button>
      <span class="countdown" id="resCountdown" aria-hidden="true"></span>
    </div>
  </main>

  <aside class="side" id="side">
    <fieldset id="controls">
      <header class="side-head">
        <h1>Items</h1>
        <span class="count" id="count">0 items</span>
      </header>

      <div class="list-wrap" id="listWrap">
        <ul class="list" id="list"></ul>
        <p class="empty" id="empty">Nothing on the wheel yet.</p>
        <form class="add" id="addForm" autocomplete="off">
          <svg class="plus" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2.6 2.4"/><path d="M9 5.5v7M5.5 9h7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <input type="text" id="newItem" placeholder="Add item" maxlength="60" aria-label="Add item" enterkeyhint="done">
        </form>
      </div>

      <div class="foot">
        <details class="settings" id="settings">
          <summary>
            Settings
            <svg class="chev" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </summary>
          <div class="settings-body">
            <div class="range">
              <div class="range-top"><label for="spinTime">Spin time</label><output id="spinTimeOut" for="spinTime">5s</output></div>
              <input type="range" id="spinTime" min="1" max="20" step="1" value="5">
            </div>

            <label class="toggle">
              <span class="toggle-text">
                <span>Disable remove item</span>
                <small>Hide the Remove button on the picked item</small>
              </span>
              <input type="checkbox" class="switch" id="noRemove" role="switch">
            </label>

            <label class="toggle">
              <span class="toggle-text">
                <span>Remove on select</span>
                <small>Take the picked item off the wheel automatically</small>
              </span>
              <input type="checkbox" class="switch" id="autoRemove" role="switch">
            </label>

            <div class="range sub" id="autoDelayRow" hidden>
              <div class="range-top"><label for="autoDelay">Show for</label><output id="autoDelayOut" for="autoDelay">3s</output></div>
              <input type="range" id="autoDelay" min="1" max="10" step="1" value="3">
            </div>
          </div>
        </details>

        <div class="tools">
          <button class="tool" type="button" id="importBtn">
            <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1.5v7.5M4 6l3 3 3-3M2 11.5h10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Import CSV
          </button>
          <button class="tool" type="button" id="recolor">Reset colors</button>
          <button class="tool danger" type="button" id="clearAll">Clear all</button>
          <input type="file" id="csvFile" accept=".csv,.txt,text/csv,text/plain" hidden>
        </div>
      </div>
    </fieldset>
    <div class="drop-hint" aria-hidden="true">Drop a CSV to add its items</div>
  </aside>
</div>

<dialog class="confirm" id="clearDialog" closedby="any">
  <form method="dialog">
    <h2>Clear the wheel?</h2>
    <p>This removes every item. It can't be undone.</p>
    <div class="confirm-actions">
      <button class="tool" value="cancel" autofocus>Cancel</button>
      <button class="tool solid-danger" value="clear">Clear all</button>
    </div>
  </form>
</dialog>

<p class="toast" id="toast" role="status" aria-live="polite" hidden></p>

<template id="rowTpl">
  <li class="row">
    <input type="color" class="dot-input" data-field="color">
    <input type="text" maxlength="60" data-field="label">
    <button type="button" class="x" data-action="remove"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 3l8 8M11 3l-8 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
  </li>
</template>
</body>
</html>
